# This file is a minimal Apache config to run PHP scripts for tests.
# It was essentially written from the default package config with:
# - all the comments removed,
# - unneeded modules and config sections removed,
# - "ServerName localhost:80" added to remove startup warning,
# - "AddType application/x-httpd-php .php" added to enable php.

ServerRoot "/"
Listen 80

LoadModule authz_core_module usr/lib/apache2/modules/mod_authz_core.so
LoadModule mime_module usr/lib/apache2/modules/mod_mime.so
LoadModule log_config_module usr/lib/apache2/modules/mod_log_config.so
LoadModule unixd_module usr/lib/apache2/modules/mod_unixd.so
LoadModule php_module usr/lib/apache2/modules/libphp.so

<IfModule unixd_module>
User daemon
Group daemon
</IfModule>

ServerAdmin you@example.com
ServerName localhost:80

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/usr/share/apache2/default-site/htdocs"
<Directory "/usr/share/apache2/default-site/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "var/log/apache2/error_log"
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    CustomLog "var/log/apache2/access_log" common
</IfModule>

<IfModule mime_module>
    TypesConfig etc/apache2/mime.types
    AddType application/x-httpd-php .php
</IfModule>
